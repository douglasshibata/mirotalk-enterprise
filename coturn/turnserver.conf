# ==============================================================================
# COTURN STUN/TURN SERVER ENTERPRISE CONFIGURATION FOR WEBRTC NAT TRAVERSAL
# ==============================================================================

# Listening port for STUN and TURN services (default is 3478)
listening-port=3478

# Listening port for TLS/DTLS (secure TURNS)
tls-listening-port=5349

# IPs of your network interfaces to bind to (leave empty to bind to all available interfaces)
# listening-ip=0.0.0.0

# Enterprise domain / realm used for user tracking and authorization
realm=company.com

# Enable long-term credential mechanism for WebRTC clients
lt-creds-mechanism

# Use Static Auth Secret (for transient dynamic TURN credentials)
# In production, WebRTC systems generate dynamic credentials using HMAC-SHA1
# with a secret key shared between the Turn server and the Auth gateway.
static-auth-secret=very_secure_turn_static_auth_secret_key

# SSL Certificate details for TURN over TLS (TURNS)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Allowed Cipher Suites for modern, secure TLS connections
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Disable insecure protocols
no-sslv3
no-tlsv1
no-tlsv1_1

# Port range for allocating relay endpoints (from WebRTC to Turn/STUN client)
# Keep it relatively narrow for demo/Docker or expand as needed
min-port=49152
max-port=49200

# Do not allow local IP address relaying to avoid security bypass
no-multicast-peers
no-local-ip

# Performance optimizations & logs
verbose
fingerprint
no-stdout-log
log-file=/var/log/turnserver.log
